<!-- Application shell: collapsible sidebar with preferences, navigation and main outlet. -->
<div class="app-shell">
  <aside class="app-sidebar" [class.is-collapsed]="sidebarCollapsed()">
    <div class="app-sidebar__top" role="group" [attr.aria-label]="'controls.preferences' | translate">
      <button
        type="button"
        class="app-controls__theme"
        (click)="toggleTheme()"
        [attr.aria-label]="'theme.toggle' | translate"
        [attr.title]="(isDark() ? 'theme.light' : 'theme.dark') | translate"
      >
        @if (isDark()) {
          <svg
            class="app-controls__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="4.2" />
            <path
              d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"
            />
          </svg>
        } @else {
          <svg
            class="app-controls__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z" />
          </svg>
        }
      </button>

      <div class="app-controls__languages">
        <button
          type="button"
          class="app-controls__lang"
          [class.is-active]="language() === 'es'"
          [attr.aria-pressed]="language() === 'es'"
          [attr.aria-label]="'language.spanish' | translate"
          [attr.title]="'language.spanish' | translate"
          (click)="setLanguage('es')"
        >
          <svg class="app-flag" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
            <defs>
              <clipPath id="flag-co-clip">
                <rect width="24" height="16" rx="3" />
              </clipPath>
            </defs>
            <g clip-path="url(#flag-co-clip)">
              <rect class="app-flag__co-yellow" width="24" height="8" />
              <rect class="app-flag__co-blue" y="8" width="24" height="4" />
              <rect class="app-flag__co-red" y="12" width="24" height="4" />
            </g>
            <rect class="app-flag__outline" x="0.5" y="0.5" width="23" height="15" rx="2.5" />
          </svg>
        </button>
        <button
          type="button"
          class="app-controls__lang"
          [class.is-active]="language() === 'en'"
          [attr.aria-pressed]="language() === 'en'"
          [attr.aria-label]="'language.english' | translate"
          [attr.title]="'language.english' | translate"
          (click)="setLanguage('en')"
        >
          <svg class="app-flag" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
            <defs>
              <clipPath id="flag-us-clip">
                <rect width="24" height="16" rx="3" />
              </clipPath>
            </defs>
            <g clip-path="url(#flag-us-clip)">
              <rect class="app-flag__us-white" width="24" height="16" />
              <rect class="app-flag__us-red" width="24" height="1.23" />
              <rect class="app-flag__us-red" y="2.46" width="24" height="1.23" />
              <rect class="app-flag__us-red" y="4.92" width="24" height="1.23" />
              <rect class="app-flag__us-red" y="7.38" width="24" height="1.23" />
              <rect class="app-flag__us-red" y="9.84" width="24" height="1.23" />
              <rect class="app-flag__us-red" y="12.3" width="24" height="1.23" />
              <rect class="app-flag__us-red" y="14.77" width="24" height="1.23" />
              <rect class="app-flag__us-blue" width="10.5" height="7.38" />
              <g class="app-flag__us-stars">
                <circle cx="1.4" cy="1.3" r="0.45" />
                <circle cx="3.3" cy="1.3" r="0.45" />
                <circle cx="5.2" cy="1.3" r="0.45" />
                <circle cx="7.1" cy="1.3" r="0.45" />
                <circle cx="9" cy="1.3" r="0.45" />
                <circle cx="2.35" cy="2.9" r="0.45" />
                <circle cx="4.25" cy="2.9" r="0.45" />
                <circle cx="6.15" cy="2.9" r="0.45" />
                <circle cx="8.05" cy="2.9" r="0.45" />
                <circle cx="1.4" cy="4.5" r="0.45" />
                <circle cx="3.3" cy="4.5" r="0.45" />
                <circle cx="5.2" cy="4.5" r="0.45" />
                <circle cx="7.1" cy="4.5" r="0.45" />
                <circle cx="9" cy="4.5" r="0.45" />
                <circle cx="2.35" cy="6.1" r="0.45" />
                <circle cx="4.25" cy="6.1" r="0.45" />
                <circle cx="6.15" cy="6.1" r="0.45" />
                <circle cx="8.05" cy="6.1" r="0.45" />
              </g>
            </g>
            <rect class="app-flag__outline" x="0.5" y="0.5" width="23" height="15" rx="2.5" />
          </svg>
        </button>
      </div>
    </div>

    <a class="app-brand" routerLink="/tasks" [attr.aria-label]="'app.title' | translate">
      <svg class="app-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="taskpage-logo-bg" x1="0" y1="0" x2="1" y2="1">
            <stop class="app-logo__stop-start" offset="0" />
            <stop class="app-logo__stop-end" offset="1" />
          </linearGradient>
          <linearGradient id="taskpage-logo-check" x1="0" y1="0" x2="1" y2="1">
            <stop class="app-logo__stop-check" offset="0" />
            <stop class="app-logo__stop-check-end" offset="1" />
          </linearGradient>
        </defs>
        <rect class="app-logo__bg" width="64" height="64" rx="16" />
        <circle class="app-logo__glow" cx="14" cy="12" r="10" />
        <path class="app-logo__lines" d="M18 22h20M18 31h14M18 40h10" />
        <circle class="app-logo__badge" cx="46" cy="45" r="12" />
        <path class="app-logo__check" d="M40.5 45.2l3.6 3.6 7-7.2" />
      </svg>
      <span class="app-brand__text">
        <span class="app-brand__name">{{ 'app.title' | translate }}</span>
        <span class="app-brand__tagline">{{ 'app.subtitle' | translate }}</span>
      </span>
    </a>

    <nav class="app-nav" [attr.aria-label]="'nav.title' | translate">
      <a
        class="app-nav__link"
        routerLink="/tasks"
        routerLinkActive="is-active"
        [attr.aria-label]="'nav.tasks' | translate"
      >
        <svg
          class="app-nav__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="4" y="4" width="16" height="16" rx="4" />
          <path d="M8.2 12.2l2.4 2.4 5-5.2" />
        </svg>
        <span class="app-nav__label">{{ 'nav.tasks' | translate }}</span>
      </a>
      <a
        class="app-nav__link"
        routerLink="/users"
        routerLinkActive="is-active"
        [attr.aria-label]="'nav.users' | translate"
      >
        <svg
          class="app-nav__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="9" cy="8.5" r="3.2" />
          <path d="M3.5 19.2c.6-3.1 2.8-4.8 5.5-4.8s4.9 1.7 5.5 4.8" />
          <path d="M16 5.6a3 3 0 0 1 0 5.8M17.6 14.7c1.6.6 2.6 2.1 2.9 4.5" />
        </svg>
        <span class="app-nav__label">{{ 'nav.users' | translate }}</span>
      </a>
    </nav>

    <button
      type="button"
      class="app-sidebar__toggle"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="!sidebarCollapsed()"
      [attr.aria-label]="(sidebarCollapsed() ? 'sidebar.show' : 'sidebar.hide') | translate"
      [attr.title]="(sidebarCollapsed() ? 'sidebar.show' : 'sidebar.hide') | translate"
    >
      <svg
        class="app-sidebar__toggle-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M14.5 6l-6 6 6 6" />
      </svg>
      <span class="app-sidebar__toggle-label">
        {{ (sidebarCollapsed() ? 'sidebar.show' : 'sidebar.hide') | translate }}
      </span>
    </button>
  </aside>

  <div class="app-content">
    <main class="app-main">
      <router-outlet />
    </main>

    <footer class="app-footer">
      <p>{{ 'footer.text' | translate }}</p>
    </footer>
  </div>
</div>
