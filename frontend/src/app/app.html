<!-- Application shell: header with navigation and switchers, main outlet and footer. -->
<div class="app-shell">
  <header class="app-header">
    <a class="app-brand" routerLink="/tasks" [attr.aria-label]="'app.title' | translate">
      <span class="app-brand__mark" aria-hidden="true"></span>
      <span class="app-brand__name">{{ 'app.title' | translate }}</span>
    </a>

    <nav class="app-nav" [attr.aria-label]="'nav.title' | translate">
      <a class="app-nav__link" routerLink="/tasks" routerLinkActive="is-active">
        {{ 'nav.tasks' | translate }}
      </a>
      <a class="app-nav__link" routerLink="/users" routerLinkActive="is-active">
        {{ 'nav.users' | translate }}
      </a>
    </nav>

    <div class="app-actions">
      <button
        type="button"
        class="app-action"
        (click)="toggleTheme()"
        [attr.aria-label]="'theme.toggle' | translate"
      >
        <span aria-hidden="true">{{ theme() === 'dark' ? '☀' : '☾' }}</span>
        <span>{{ (theme() === 'dark' ? 'theme.light' : 'theme.dark') | translate }}</span>
      </button>
      <button
        type="button"
        class="app-action"
        (click)="toggleLanguage()"
        [attr.aria-label]="'language.toggle' | translate"
      >
        <span>{{ languageLabel() }}</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <p>{{ 'footer.text' | translate }}</p>
  </footer>
</div>
