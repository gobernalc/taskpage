# Continuous integration for TaskPage.
# Validates every pull request before it reaches the trunk and keeps main green.
name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# A new push to the same branch cancels the previous run to save minutes.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    backend:
        name: backend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - name: Set up .NET 10
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"
                  cache: true
                  cache-dependency-path: backend/**/*.csproj
            - name: Restore
              run: dotnet restore TaskPage.slnx
            - name: Build
              run: dotnet build TaskPage.slnx --no-restore
            - name: Test
              run: dotnet test TaskPage.slnx --no-build --logger "console;verbosity=detailed"

    frontend:
        name: frontend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install
              run: npm ci
            - name: Build
              run: npm run build
            - name: Test
              run: npx ng test --watch=false
